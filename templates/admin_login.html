<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat2API 管理登录</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1020;color:#e5e7eb;min-height:100vh;display:grid;place-items:center}.box{width:min(92%,390px);background:#151c30;border:1px solid #27324c;border-radius:18px;padding:32px;box-shadow:0 24px 70px #0008}h1{margin:0 0 8px;font-size:24px}p{color:#94a3b8;margin:0 0 24px}input,button{width:100%;padding:13px 14px;border-radius:10px;font-size:15px}input{background:#0b1020;border:1px solid #334155;color:white;outline:none}input:focus{border-color:#6366f1}button{margin-top:12px;border:0;background:#6366f1;color:white;font-weight:700;cursor:pointer}.err{height:22px;color:#fb7185;margin-top:12px;font-size:14px}</style></head><body><main class="box"><h1>Chat2API 管理后台</h1><p>请输入管理员访问密码</p><form id="form"><input id="password" type="password" autocomplete="current-password" placeholder="访问密码" autofocus required><button>登录</button><div id="err" class="err"></div></form></main><script>const root={{ admin_root|tojson }};document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const r=await fetch(root+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(r.ok)location.reload();else err.textContent='密码错误，请重试';};</script></body></html>
